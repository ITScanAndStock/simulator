name: CI

on: pull_request

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.check }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HUSKY: 0
      NEXT_TELEMETRY_DISABLED: 1
    strategy:
      fail-fast: false
      matrix:
        check: [typecheck, lint, "format:check", test, build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run ${{ matrix.check }}

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_USER: simulator
          POSTGRES_PASSWORD: simulator
          POSTGRES_DB: simulator-e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simulator -d simulator-e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HUSKY: 0
      NEXT_TELEMETRY_DISABLED: 1
      E2E_DATABASE_URL: postgresql://simulator:simulator@localhost:5432/simulator-e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-output
          path: test-results/
          if-no-files-found: ignore
